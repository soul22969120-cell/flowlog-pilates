der:0}.calendar-icon{width:38px;height:38px;border-radius:11px;background:var(--sage);display:grid;place-items:center;color:var(--deep);font-size:12px;font-weight:900}.booking-main{flex:1}.booking-main strong,.booking-main small{display:block}.booking-main small{font-size:11px;color:var(--muted);margin-top:4px}.cancel{background:none;color:var(--coral);font-size:11px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:25px}.admin{display:none}.admin.show{display:block}.student.hide{display:none}.agenda{display:grid;gap:10px}.agenda-row{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:14px}.agenda-time{width:74px;font-weight:900}.agenda-info{flex:1}.agenda-info small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.tag{font-size:11px;background:var(--sage);color:var(--deep);padding:6px 9px;border-radius:99px}.block-list{display:grid;gap:9px}.block-item{display:flex;justify-content:space-between;background:#f8fbf9;padding:12px;border-radius:11px;font-size:13px}.block-item button{border:0;background:none;color:var(--muted);cursor:pointer}.primary,.secondary{padding:11px 16px;border-radius:9px;font-weight:800}.primary{background:var(--deep);color:#fff}.secondary{background:#eff3f1;color:var(--muted)}.modal-back{position:fixed;inset:0;background:#1a2e2a59;display:none;place-items:center;padding:20px}.modal-back.open{display:grid}.modal{background:#fff;width:min(430px,100%);border-radius:18px;padding:25px}.modal h2{margin:0 0 8px}.modal p{font-size:13px;color:var(--muted)}.form{display:grid;gap:13px}.form label{font-size:12px;color:var(--muted)}.form input{display:block;width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;margin-top:6px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:5px}.toast{position:fixed;right:22px;bottom:22px;background:#263d38;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;display:none}.toast.show{display:block}@media(ma </style></head><body><header class="top"><div class="brand"><div class="mark">F</div><div><strong>FlowLog</strong><small>皮拉提斯預約</small></div></div><div class="mode"><button class="active" id="studentMode">學生預約</button><button id="coachMode">老師管理</button></div></header><main class="wrap"><section class="student" id="studentView"><div class="hero"><div><div class="eyebrow">BOOK A SESSION</div><h1>選一個適合你的時間。</h1><p>像預約餐廳一樣，先選日期，再選擇有空的時段。</p></div><button class="login" id="loginBtn">◉ 使用 LINE 登入</button></div><div class="grid"><section class="panel"><div class="panel-head"><div><h2>選擇上課日期</h2><div class="sub">目前開放未來 30 天預約</div></div><div class="month"><button id="prevMonth" aria-label="上個月">‹</button><strong id="monthLabel"></strong><button id="nextMonth" aria-label="下個月">›</button></div></div><div class="calendar-head"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="calendar" id="calendar"></div><div style="height:22px"></div><div class="panel-head" style="margin-bottom:13px"><div><h2 id="slotTitle">可預約時段</h2><div class="sub">每堂課 50 分鐘</div></div></div><div class="slots" id="slots"></div><div class="hint">小提醒：預約後如需取消或改期，請至少提前 24 小時告知老師。</div></section><aside class="panel"><div class="panel-head"><div><h2>我的預約</h2><div class="sub">登入後可查看與管理課程</div></div></div><div id="upcoming"></div><div class="side-card"><strong>第一次來嗎？</strong>使用 LINE 登入即可預約，不需要另外設定密碼。</div></aside></div></section><section class="admin" id="adminView"><div class="hero"><div><div class="eyebrow">COACH WORKSPACE</div><h1>今天的課，排得剛剛好。</h1><p>查看預約與已鎖定時段。</p></div><button class="primary" id="addSlot">＋ 開放時段</button></div><div class="admin-grid"><section class="panel"><div class="panel-head"><div><h2>近期預約</h2><div class="sub" id="adminDateLabel"></div></div><span class="tag" id="bookedCount"></span></div><div class="agenda" id="agenda"></div></section><section class="panel"><div class="panel-head"><div><h2>已鎖定時段</h2><div class="sub">學生完成預約後自動出現</div></div></div><div class="block-list" id="lockedList"></div></section></div></section></main><div class="modal-back" id="modal"><div class="modal"><h2>確認預約</h2><p id="modalText"></p><form class="form" id="bookingForm"><label>你的姓名<input name="name" required placeholder="例如：王小美"></label><label>手機號碼<input name="phone" required placeholder="方便老師聯絡你"></label><div class="actions"><button class="secondary" type="button" id="closeModal">返回</button><button class="primary" type="submit">確認預約</button></div></form></div></div><div class="toast" id="toast"></div><script>
const names=['日','一','二','三','四','五','六'],times=['09:00','10:00','11:00','14:00','15:00','16:00','17:00','19:00'],today=new Date();today.setHours(0,0,0,0);let selected=new Date(today),monthCursor=new Date(today.getFullYear(),today.getMonth(),1),pending=null,loggedIn=false;const dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,offset=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-today)/86400000),dateAt=n=>{const d=new Date(today);d.setDate(today.getDate()+n);return d},fmt=d=>`${d.getMonth()+1}/${d.getDate()}（${names[d.getDay()]}）`,el=id=>document.getElementById(id);let seed={};[1,3,5].forEach((n,i)=>seed[dayKey(dateAt(n))]=i===0?['10:00','16:00']:i===1?['09:00','15:00']:['11:00']);let bookings=JSON.parse(localStorage.getItem('flowlog-v1-bookings')||'null')||[{id:1,offset:1,time:'10:00',name:'林怡君',phone:'',status:'已預約'},{id:2,offset:3,time:'14:00',name:'陳品妤',phone:'',status:'已預約'}];const save=()=>localStorage.setItem('flowlog-v1-bookings',JSON.stringify(bookings));function booked(n,t){return(seed[dayKey(dateAt(n))]||[]).includes(t)||bookings.some(b=>b.offset===n&&b.time===t)}function renderCalendar(){const c=el('calendar');c.innerHTML='';let first=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),1).getDay(),days=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,0).getDate();for(let i=0;i<first;i++){let x=document.createElement('div');x.className='date blank';c.appendChild(x)}for(let n=1;n<=days;n++){let d=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),n),no=offset(d),available=no>=0&&no<=30?times.filter(t=>!booked(no,t)).length:0,b=document.createElement('button');b.className='date'+(no===offset(selected)?' selected':'')+(no===0?' today':'')+(no<0||no>30?' disabled':'');b.disabled=no<0||no>30;b.innerHTML=`<span class="day-note">${no===0?'今天':''}</span><b>${n}</b><small>${available?available+' 個空檔':no>=0&&no<=30?'已額滿':'未開放'}</small>`;b.onclick=()=>{selected=d;render()};c.appendChild(b)}el('monthLabel').textContent=`${monthCursor.getFullYear()} 年 ${monthCursor.getMonth()+1} 月`}function renderSlots(){let n=offset(selected);el('slotTitle').textContent=`${selected.getMonth()+1} 月 ${selected.getDate()} 日可預約時段`;el('slots').innerHTML=n<0||n>30?'<div class="empty">請選擇開放預約的日期</div>':times.map(t=>{let x=booked(n,t);return`<button class="slot ${x?'booked':''}" ${x?'disabled':''} data-time="${t}"><b>${t}</b><small>${x?'已被預約':'尚有名額'}</small></button>`}).join('');document.querySelectorAll('.slot:not(.booked)').forEach(b=>b.onclick=()=>{pending={offset:n,time:b.dataset.time};el('modalText').textContent=`${fmt(selected)} ${b.dataset.time} · 皮拉提斯一對一`;el('modal').classList.add('open')})}function renderUpcoming(){let list=bookings.slice().sort((a,b)=>a.offset-b.offset||a.time.localeCompare(b.time));el('upcoming').innerHTML=list.length?list.map(b=>`<div class="booking"><div class="calendar-icon">${dateAt(b.offset).getDate()}</div><div class="booking-main"><strong>${fmt(dateAt(b.offset))} · ${b.time}</strong><small>${b.name} · 皮拉提斯一對一</small></div><button class="cancel" data-id="${b.id}">取消</button></div>`).join(''):'<div class="empty">目前還沒有預約<br>選一個時段開始吧</div>';document.querySelectorAll('.cancel').forEach(x=>x.onclick=()=>{bookings=bookings.filter(b=>b.id!==+x.dataset.id);save();render();toast('預約已取消，時段重新開放')})}function renderAdmin(){let list=bookings.slice().sort((a,b)=>a.offset-b.offset||a.time.localeCompare(b.time));el('adminDateLabel').textContent=`未來 30 天共 ${list.length} 筆預約`;el('bookedCount').textContent=`${list.length} 個時段已鎖定`;el('agenda').innerHTML=list.length?list.map(b=>`<div class="agenda-row"><div class="agenda-time">${fmt(dateAt(b.offset))}<br><small>${b.time}</small></div><div class="agenda-info"><strong>${b.name}</strong><small>皮拉提斯一對一 · ${b.phone||'LINE 預約'}</small></div><span class="tag">已預約</span></div>`).join(''):'<div class="empty">目前沒有預約</div>';el('lockedList').innerHTML=list.length?list.map(b=>`<div class="block-item"><span>${fmt(dateAt(b.offset))} · ${b.time}</span><button data-unlock="${b.id}">解除</button></div>`).join(''):'<div class="empty">尚無鎖定時段</div>';document.querySelectorAll('[data-unlock]').forEach(x=>x.onclick=()=>{bookings=bookings.filter(b=>b.id!==+x.dataset.unlock);save();render();toast('時段已解除鎖定')})}function render(){renderCalendar();renderSlots();renderUpcoming();renderAdmin()}function toast(s){el('toast').textContent=s;el('toast').classList.add('show');setTimeout(()=>el('toast').classList.remove('show'),2200)}el('bookingForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);bookings.push({id:Date.now(),offset:pending.offset,time:pending.time,name:f.get('name'),phone:f.get('phone'),status:'已預約'});save();el('modal').classList.remove('open');e.target.reset();render();toast('預約成功！時段已為你鎖定')};el('closeModal').onclick=()=>el('modal').classList.remove('open');el('modal').onclick=e=>{if(e.target===el('modal'))el('modal').classList.remove('open')};el('loginBtn').onclick=()=>{loggedIn=!loggedIn;el('loginBtn').textContent=loggedIn?'✓ LINE 已登入':'◉ 使用 LINE 登入';el('loginBtn').classList.toggle('logged',loggedIn);toast(loggedIn?'LINE 登入成功（示範）':'已登出')};el('prevMonth').onclick=()=>{let p=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,1);if(p>=new Date(today.getFullYear(),today.getMonth(),1)){monthCursor=p;render()}};el('nextMonth').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,1);render()};el('studentMode').onclick=()=>{el('studentMode').classList.add('active');el('coachMode').classList.remove('active');el('studentView').classList.remove('hide');el('adminView').classList.remove('show')};el('coachMode').onclick=()=>{el('coachMode').classList.add('active');el('studentMode').classList.remove('active');el('studentView').classList.add('hide');el('adminView').classList.add('show')};el('addSlot').onclick=()=>toast('第一版先以固定可預約時段示範；之後可在這裡新增老師的工作時段');render();
</script></body></html>

<script>const bookingWindow=90;document.querySelector('.student .panel .sub').textContent='目前開放未來 3 個月預約';renderCalendar=()=>{const c=el('calendar');c.innerHTML='';let first=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),1).getDay(),days=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,0).getDate();for(let i=0;i<first;i++){let x=document.createElement('div');x.className='date blank';c.appendChild(x)}for(let n=1;n<=days;n++){let d=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),n),no=offset(d),available=no>=0&&no<=bookingWindow?times.filter(t=>!booked(no,t)).length:0,b=document.createElement('button');b.className='date'+(no===offset(selected)?' selected':'')+(no===0?' today':'')+(no<0||no>bookingWindow?' disabled':'');b.disabled=no<0||no>bookingWindow;b.innerHTML=`<span class="day-note">${no===0?'今天':''}</span><b>${n}</b><small>${available?available+' 個空檔':no>=0&&no<=bookingWindow?'已額滿':'未開放'}</small>`;b.onclick=()=>{selected=d;render()};c.appendChild(b)}el('monthLabel').textContent=`${monthCursor.getFullYear()} 年 ${monthCursor.getMonth()+1} 月`};renderSlots=()=>{let n=offset(selected);el('slotTitle').textContent=`${selected.getMonth()+1} 月 ${selected.getDate()} 日可預約時段`;el('slots').innerHTML=n<0||n>bookingWindow?'<div class="empty">請選擇開放預約的日期</div>':times.map(t=>{let x=booked(n,t);return`<button class="slot ${x?'booked':''}" ${x?'disabled':''} data-time="${t}"><b>${t}</b><small>${x?'已被預約':'尚有名額'}</small></button>`}).join('');document.querySelectorAll('.slot:not(.booked)').forEach(b=>b.onclick=()=>{pending={offset:n,time:b.dataset.time};el('modalText').textContent=`${fmt(selected)} ${b.dataset.time} · 皮拉提斯一對一`;el('modal').classList.add('open')})};render();</script>
<script>
// 線上預約只需要姓名與生日；生日可輸入 0827 或 08/27。
const bookingForm=el('bookingForm');
if(bookingForm){
  bookingForm.innerHTML='<div class="actions"><button class="secondary" type="button" id="closeModal">返回</button><button class="primary" type="submit">確認預約</button></div>';
  el('closeModal').onclick=()=>el('modal').classList.remove('open');

</script>
<!-- LINE 登入只由下方單一控制器處理，避免兩套 callback 流程互相清除 session。 -->
<style>
  /* 學生頁面只保留日曆與預約操作，登入按鈕會由確認視窗顯示。 */
  .student > .hero { display: none !important; }
</style>
<style>
/* 確認視窗的按鈕保持可點擊，避免被背景遮罩攔截 */
.modal-back.open,
.modal-back.open .modal,
.modal-back.open .modal * { pointer-events: auto; }
.modal-back.open button { position: relative; z-index: 1002; cursor: pointer; }
</style>
<script>
/* 本機預覽的最後一道按鈕保護；正式網站仍交給 LINE OAuth。 */
if (location.protocol === 'file:') {
  document.addEventListener('click', function (event) {
    const button = event.target.closest && event.target.closest('#loginBtn, #closeModal');
    if (!button) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (button.id === 'closeModal') {
      el('modal').classList.remove('open');
      return;
    }
    window.FLOWLOG_TEST_LOGGED = true;
    window.FLOWLOG_LINE_NAME = '謝守';
    button.type = 'button';
    button.classList.add('logged');
    button.textContent = '✓ LINE 已登入（測試）';
    const form = el('bookingForm');
    if (form) {
      form.querySelectorAll('label').forEach(node => node.remove());
      form.querySelectorAll('input[type="hidden"][name="name"]').forEach(node => node.remove());
      const name = document.createElement('input');
      name.type = 'hidden'; name.name = 'name'; name.value = '謝守';
      form.prepend(name);
    }
    toast('本機測試：已帶入 LINE 姓名');
  }, true);
}
</script>
<style>#loginBtn{position:relative;z-index:20;pointer-events:auto}</style>
<style>.modal-back.open{z-index:1000;pointer-events:auto}.modal-back.open .modal{position:relative;z-index:1001;pointer-events:auto}.modal-back.open button{position:relative;z-index:1002;pointer-events:auto;cursor:pointer}</style>
<script>

if(location.protocol==='file:'){
  document.addEventListener('click',event=>{
    const button=event.target.closest?.('#loginBtn');

    event.preventDefault();

    button.textContent='✓ LINE 已登入（測試）';

    if(form){
      form.querySelectorAll('label').forEach(node=>node.remove());
      form.querySelectorAll('input[type="hidden"][name="name"],input[type="hidden"][name="birthday_mmdd"]').forEach(node=>node.remove());
      const nameInput=document.createElement('input');nameInput.type='hidden';nameInput.name='name';nameInput.value='謝守';form.prepend(nameInput);

})();

<script>
// 登入後重新渲染日曆時，仍維持空白日期的點擊功能。
(()=>{
  const refresh=()=>document.querySelectorAll('#calendar .date:not(.blank)').forEach(cell=>{
    if(cell.classList.contains('has-own-booking'))return;
    const day=cell.querySelector('b')?.textContent;
    if(!day)return;
    const n=offset(new Date(monthCursor.getFullYear(),monthCursor.getMonth(),+day));
    if(n>=0&&n<=bookingWindow)cell.disabled=false;
    cell.onclick=null;
  });
  document.addEventListener('click',event=>{
    const cell=event.target.closest?.('#calendar .date:not(.blank)');
    if(!cell||cell.classList.contains('has-own-booking')||cell.disabled)return;
    event.preventDefault();
    event.stopPropagation();
    const day=cell.querySelector('b')?.textContent;
    if(!day)return;
    const date=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),+day),n=offset(date);
    selected=date;
    const available=times.filter(t=>!booked(n,t));
    document.getElementById('quickDateTitle').textContent=`${fmt(date)} 選擇時段`;
    document.getElementById('quickSlots').innerHTML=available.length?available.map(t=>`<button type="button" class="slot"><b>${t}</b></button>`).join(''):'<div class="empty">這天目前沒有可預約時段</div>';
    document.querySelectorAll('#quickSlots .slot').forEach(button=>button.onclick=()=>{
      pending={offset:n,time:button.querySelector('b').textContent};
      document.getElementById('modalText').textContent=`${fmt(date)} ${pending.time}`;
      document.getElementById('quickDateTitle').closest('.modal-back').classList.remove('open');
      document.getElementById('modal').classList.add('open');
    });
    document.getElementById('quickDateTitle').closest('.modal-back').classList.add('open');
  },true);
  const oldRenderForDates=render;
  render=()=>{oldRenderForDates();refresh()};
  refresh();
})();
</script>

<script>
// 同日預約限制：學生需聯絡老師處理當天的預約。
(()=>{
  const notice='當天無法預約或修改，請聯絡老師。';
  const sameDay=date=>date&&date.getFullYear()===today.getFullYear()&&date.getMonth()===today.getMonth()&&date.getDate()===today.getDate();
  const warn=event=>{
    event.preventDefault();
    event.stopImmediatePropagation();
    document.querySelectorAll('.modal-back:not(#modal)').forEach(node=>node.classList.remove('open'));
    toast(notice);
  };
  document.addEventListener('click',event=>{
    const cell=event.target.closest?.('#calendar .date:not(.blank)');
    if(cell){
      const day=cell.querySelector('b')?.textContent;
      if(day&&sameDay(new Date(monthCursor.getFullYear(),monthCursor.getMonth(),+day))){
        warn(event);
        return;
      }
    }
    const action=event.target.closest?.('[data-front-save],[data-front-cancel],[data-summary-id],[data-api-cancel]');
    if(action){
      const row=action.closest('.front-manage-row');
      const dateValue=row?.querySelector('input[type="date"]')?.value;
      const booking=bookings.find(item=>String(item.id)===String(action.dataset.frontCancel||action.dataset.frontSave||action.dataset.summaryId||action.dataset.apiCancel));
      const date= dateValue ? new Date(dateValue+'T00:00:00') : booking ? dateAt(booking.offset) : null;
      if(sameDay(date))warn(event);
    }
  },true);
  el('bookingForm')?.addEventListener('submit',event=>{
    if(pending&&sameDay(dateAt(pending.offset)))warn(event);
  },true);
})();
</script>
