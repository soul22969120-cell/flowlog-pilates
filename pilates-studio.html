<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowLog｜皮拉提斯預約</title><style>
:root{--ink:#263532;--muted:#71807b;--line:#e3ebe7;--bg:#f5f8f6;--deep:#28665b;--sage:#dceee5;--panel:#fff;--coral:#e98d73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1120px)/2))}.brand{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:13px;background:var(--deep);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;transform:rotate(-7deg)}.brand strong{display:block}.brand small{font-size:11px;color:var(--muted)}.mode{display:flex;gap:4px;padding:4px;background:#f1f5f2;border-radius:10px}.mode button,.login,.secondary,.primary,.date,.slot,.cancel,.month button{font:inherit;cursor:pointer;border:0}.mode button{font-size:12px;color:var(--muted);background:transparent;border-radius:7px;padding:8px 13px}.mode button.active{background:#fff;color:var(--deep);font-weight:900}.wrap{max-width:1120px;margin:auto;padding:42px 18px 70px}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--deep);font-weight:900}.hero h1{font-size:31px;letter-spacing:-.04em;margin:8px 0}.hero p{font-size:14px;color:var(--muted);margin:0}.login{background:#fff;border:1px solid var(--line);color:var(--deep);border-radius:10px;padding:11px 15px;font-weight:800}.login.logged{background:var(--sage);border-color:var(--sage)}.grid,.admin-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.75fr);gap:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 18px 44px rgba(36,71,62,.08)}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.panel h2{font-size:18px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}.month{display:flex;align-items:center;gap:7px}.month button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--deep);font-size:20px}.month strong{font-size:13px;min-width:90px;text-align:center}.calendar-head,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.calendar-head{margin-bottom:7px}.calendar-head span{text-align:center;color:var(--muted);font-size:11px;font-weight:800}.date{min-height:82px;padding:10px 3px;border:1px solid var(--line);background:#fbfcfb;border-radius:12px;text-align:center;color:var(--ink)}.date:hover{border-color:#9fcab9}.date.blank{visibility:hidden}.date.disabled{color:#c3cbc7;cursor:not-allowed}.date.today{border-color:#9fcab9}.date.selected{background:var(--deep);color:#fff;border-color:var(--deep)}.date .day-note{display:block;height:13px;font-size:10px;color:var(--deep)}.date b{display:block;font-size:18px;margin:4px 0 7px}.date small{font-size:10px;color:var(--deep);background:var(--sage);border-radius:99px;padding:3px 6px}.date.disabled small{background:transparent;color:#b9c3be}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.slot{padding:13px 10px;text-align:left;border:1px solid #c9e1d7;background:#f8fcfa;color:var(--deep);border-radius:11px}.slot:hover{background:var(--sage)}.slot b,.slot small{display:block}.slot small{margin-top:5px;color:var(--muted);font-size:11px}.slot.booked{background:#f2f4f3;border-color:#edf0ee;color:#9aa7a2;cursor:not-allowed;text-decoration:line-through}.hint,.side-card{border-radius:12px;padding:13px 14px;font-size:12px;line-height:1.6}.hint{margin-top:18px;background:#fff8e8;border:1px solid #f1dfae;color:#8a6c26}.side-card{background:#f8fbf9;margin-top:16px;color:var(--muted)}.side-card strong{display:block;color:var(--ink);margin-bottom:5px}.booking{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.booking:last-child{border:0}.calendar-icon{width:38px;height:38px;border-radius:11px;background:var(--sage);display:grid;place-items:center;color:var(--deep);font-size:12px;font-weight:900}.booking-main{flex:1}.booking-main strong,.booking-main small{display:block}.booking-main small{font-size:11px;color:var(--muted);margin-top:4px}.cancel{background:none;color:var(--coral);font-size:11px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:25px}.admin{display:none}.admin.show{display:block}.student.hide{display:none}.agenda{display:grid;gap:10px}.agenda-row{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:14px}.agenda-time{width:74px;font-weight:900}.agenda-info{flex:1}.agenda-info small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.tag{font-size:11px;background:var(--sage);color:var(--deep);padding:6px 9px;border-radius:99px}.block-list{display:grid;gap:9px}.block-item{display:flex;justify-content:space-between;background:#f8fbf9;padding:12px;border-radius:11px;font-size:13px}.block-item button{border:0;background:none;color:var(--muted);cursor:pointer}.primary,.secondary{padding:11px 16px;border-radius:9px;font-weight:800}.primary{background:var(--deep);color:#fff}.secondary{background:#eff3f1;color:var(--muted)}.modal-back{position:fixed;inset:0;background:#1a2e2a59;display:none;place-items:center;padding:20px}.modal-back.open{display:grid}.modal{background:#fff;width:min(430px,100%);border-radius:18px;padding:25px}.modal h2{margin:0 0 8px}.modal p{font-size:13px;color:var(--muted)}.form{display:grid;gap:13px}.form label{font-size:12px;color:var(--muted)}.form input{display:block;width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;margin-top:6px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:5px}.toast{position:fixed;right:22px;bottom:22px;background:#263d38;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;display:none}.toast.show{display:block}@media(max-width:760px){.top{height:auto;padding:14px 15px;flex-wrap:wrap;gap:12px}.mode{order:3;width:100%}.mode button{flex:1}.wrap{padding:27px 15px}.hero{display:block}.hero h1{font-size:27px}.login{margin-top:16px}.grid,.admin-grid{grid-template-columns:1fr}.panel{padding:18px}.calendar-head,.calendar{gap:4px}.date{min-height:70px;padding:7px 1px}.date b{font-size:17px}.date small{font-size:9px;padding:2px 3px}.slots{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><div class="brand"><div class="mark">F</div><div><strong>FlowLog</strong><small>皮拉提斯預約</small></div></div><div class="mode"><button class="active" id="studentMode">學生預約</button><button id="coachMode">老師管理</button></div></header><main class="wrap"><section class="student" id="studentView"><div class="hero"><div><div class="eyebrow">BOOK A SESSION</div><h1>選一個適合你的時間。</h1><p>像預約餐廳一樣，先選日期，再選擇有空的時段。</p></div><button class="login" id="loginBtn">◉ 使用 LINE 登入</button></div><div class="grid"><section class="panel"><div class="panel-head"><div><h2>選擇上課日期</h2><div class="sub">目前開放未來 30 天預約</div></div><div class="month"><button id="prevMonth" aria-label="上個月">‹</button><strong id="monthLabel"></strong><button id="nextMonth" aria-label="下個月">›</button></div></div><div class="calendar-head"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="calendar" id="calendar"></div><div style="height:22px"></div><div class="panel-head" style="margin-bottom:13px"><div><h2 id="slotTitle">可預約時段</h2><div class="sub">每堂課 50 分鐘</div></div></div><div class="slots" id="slots"></div><div class="hint">小提醒：預約後如需取消或改期，請至少提前 24 小時告知老師。</div></section><aside class="panel"><div class="panel-head"><div><h2>我的預約</h2><div class="sub">登入後可查看與管理課程</div></div></div><div id="upcoming"></div><div class="side-card"><strong>第一次來嗎？</strong>使用 LINE 登入即可預約，不需要另外設定密碼。</div></aside></div></section><section class="admin" id="adminView"><div class="hero"><div><div class="eyebrow">COACH WORKSPACE</div><h1>今天的課，排得剛剛好。</h1><p>查看預約與已鎖定時段。</p></div><button class="primary" id="addSlot">＋ 開放時段</button></div><div class="admin-grid"><section class="panel"><div class="panel-head"><div><h2>近期預約</h2><div class="sub" id="adminDateLabel"></div></div><span class="tag" id="bookedCount"></span></div><div class="agenda" id="agenda"></div></section><section class="panel"><div class="panel-head"><div><h2>已鎖定時段</h2><div class="sub">學生完成預約後自動出現</div></div></div><div class="block-list" id="lockedList"></div></section></div></section></main><div class="modal-back" id="modal"><div class="modal"><h2>確認預約</h2><p id="modalText"></p><form class="form" id="bookingForm"><label>你的姓名<input name="name" required placeholder="例如：王小美"></label><label>手機號碼<input name="phone" required placeholder="方便老師聯絡你"></label><div class="actions"><button class="secondary" type="button" id="closeModal">返回</button><button class="primary" type="submit">確認預約</button></div></form></div></div><div class="toast" id="toast"></div><script>
const names=['日','一','二','三','四','五','六'],times=['09:00','10:00','11:00','14:00','15:00','16:00','17:00','19:00'],today=new Date();today.setHours(0,0,0,0);let selected=new Date(today),monthCursor=new Date(today.getFullYear(),today.getMonth(),1),pending=null,loggedIn=false;const dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,offset=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-today)/86400000),dateAt=n=>{const d=new Date(today);d.setDate(today.getDate()+n);return d},fmt=d=>`${d.getMonth()+1}/${d.getDate()}（${names[d.getDay()]}）`,el=id=>document.getElementById(id);let seed={};[1,3,5].forEach((n,i)=>seed[dayKey(dateAt(n))]=i===0?['10:00','16:00']:i===1?['09:00','15:00']:['11:00']);let bookings=JSON.parse(localStorage.getItem('flowlog-v1-bookings')||'null')||[{id:1,offset:1,time:'10:00',name:'林怡君',phone:'',status:'已預約'},{id:2,offset:3,time:'14:00',name:'陳品妤',phone:'',status:'已預約'}];const save=()=>localStorage.setItem('flowlog-v1-bookings',JSON.stringify(bookings));function booked(n,t){return(seed[dayKey(dateAt(n))]||[]).includes(t)||bookings.some(b=>b.offset===n&&b.time===t)}function renderCalendar(){const c=el('calendar');c.innerHTML='';let first=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),1).getDay(),days=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,0).getDate();for(let i=0;i<first;i++){let x=document.createElement('div');x.className='date blank';c.appendChild(x)}for(let n=1;n<=days;n++){let d=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),n),no=offset(d),available=no>=0&&no<=30?times.filter(t=>!booked(no,t)).length:0,b=document.createElement('button');b.className='date'+(no===offset(selected)?' selected':'')+(no===0?' today':'')+(no<0||no>30?' disabled':'');b.disabled=no<0||no>30;b.innerHTML=`<span class="day-note">${no===0?'今天':''}</span><b>${n}</b><small>${available?available+' 個空檔':no>=0&&no<=30?'已額滿':'未開放'}</small>`;b.onclick=()=>{selected=d;render()};c.appendChild(b)}el('monthLabel').textContent=`${monthCursor.getFullYear()} 年 ${monthCursor.getMonth()+1} 月`}function renderSlots(){let n=offset(selected);el('slotTitle').textContent=`${selected.getMonth()+1} 月 ${selected.getDate()} 日可預約時段`;el('slots').innerHTML=n<0||n>30?'<div class="empty">請選擇開放預約的日期</div>':times.map(t=>{let x=booked(n,t);return`<button class="slot ${x?'booked':''}" ${x?'disabled':''} data-time="${t}"><b>${t}</b><small>${x?'已被預約':'尚有名額'}</small></button>`}).join('');document.querySelectorAll('.slot:not(.booked)').forEach(b=>b.onclick=()=>{pending={offset:n,time:b.dataset.time};el('modalText').textContent=`${fmt(selected)} ${b.dataset.time} · 皮拉提斯一對一`;el('modal').classList.add('open')})}function renderUpcoming(){let list=bookings.slice().sort((a,b)=>a.offset-b.offset||a.time.localeCompare(b.time));el('upcoming').innerHTML=list.length?list.map(b=>`<div class="booking"><div class="calendar-icon">${dateAt(b.offset).getDate()}</div><div class="booking-main"><strong>${fmt(dateAt(b.offset))} · ${b.time}</strong><small>${b.name} · 皮拉提斯一對一</small></div><button class="cancel" data-id="${b.id}">取消</button></div>`).join(''):'<div class="empty">目前還沒有預約<br>選一個時段開始吧</div>';document.querySelectorAll('.cancel').forEach(x=>x.onclick=()=>{bookings=bookings.filter(b=>b.id!==+x.dataset.id);save();render();toast('預約已取消，時段重新開放')})}function renderAdmin(){let list=bookings.slice().sort((a,b)=>a.offset-b.offset||a.time.localeCompare(b.time));el('adminDateLabel').textContent=`未來 30 天共 ${list.length} 筆預約`;el('bookedCount').textContent=`${list.length} 個時段已鎖定`;el('agenda').innerHTML=list.length?list.map(b=>`<div class="agenda-row"><div class="agenda-time">${fmt(dateAt(b.offset))}<br><small>${b.time}</small></div><div class="agenda-info"><strong>${b.name}</strong><small>皮拉提斯一對一 · ${b.phone||'LINE 預約'}</small></div><span class="tag">已預約</span></div>`).join(''):'<div class="empty">目前沒有預約</div>';el('lockedList').innerHTML=list.length?list.map(b=>`<div class="block-item"><span>${fmt(dateAt(b.offset))} · ${b.time}</span><button data-unlock="${b.id}">解除</button></div>`).join(''):'<div class="empty">尚無鎖定時段</div>';document.querySelectorAll('[data-unlock]').forEach(x=>x.onclick=()=>{bookings=bookings.filter(b=>b.id!==+x.dataset.unlock);save();render();toast('時段已解除鎖定')})}function render(){renderCalendar();renderSlots();renderUpcoming();renderAdmin()}function toast(s){el('toast').textContent=s;el('toast').classList.add('show');setTimeout(()=>el('toast').classList.remove('show'),2200)}el('bookingForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);bookings.push({id:Date.now(),offset:pending.offset,time:pending.time,name:f.get('name'),phone:f.get('phone'),status:'已預約'});save();el('modal').classList.remove('open');e.target.reset();render();toast('預約成功！時段已為你鎖定')};el('closeModal').onclick=()=>el('modal').classList.remove('open');el('modal').onclick=e=>{if(e.target===el('modal'))el('modal').classList.remove('open')};el('loginBtn').onclick=()=>{loggedIn=!loggedIn;el('loginBtn').textContent=loggedIn?'✓ LINE 已登入':'◉ 使用 LINE 登入';el('loginBtn').classList.toggle('logged',loggedIn);toast(loggedIn?'LINE 登入成功（示範）':'已登出')};el('prevMonth').onclick=()=>{let p=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,1);if(p>=new Date(today.getFullYear(),today.getMonth(),1)){monthCursor=p;render()}};el('nextMonth').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,1);render()};el('studentMode').onclick=()=>{el('studentMode').classList.add('active');el('coachMode').classList.remove('active');el('studentView').classList.remove('hide');el('adminView').classList.remove('show')};el('coachMode').onclick=()=>{el('coachMode').classList.add('active');el('studentMode').classList.remove('active');el('studentView').classList.add('hide');el('adminView').classList.add('show')};el('addSlot').onclick=()=>toast('第一版先以固定可預約時段示範；之後可在這裡新增老師的工作時段');render();
</script></body></html>

<script>const bookingWindow=90;document.querySelector('.student .panel .sub').textContent='目前開放未來 3 個月預約';renderCalendar=()=>{const c=el('calendar');c.innerHTML='';let first=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),1).getDay(),days=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,0).getDate();for(let i=0;i<first;i++){let x=document.createElement('div');x.className='date blank';c.appendChild(x)}for(let n=1;n<=days;n++){let d=new Date(monthCursor.getFullYear(),monthCursor.getMonth(),n),no=offset(d),available=no>=0&&no<=bookingWindow?times.filter(t=>!booked(no,t)).length:0,b=document.createElement('button');b.className='date'+(no===offset(selected)?' selected':'')+(no===0?' today':'')+(no<0||no>bookingWindow?' disabled':'');b.disabled=no<0||no>bookingWindow;b.innerHTML=`<span class="day-note">${no===0?'今天':''}</span><b>${n}</b><small>${available?available+' 個空檔':no>=0&&no<=bookingWindow?'已額滿':'未開放'}</small>`;b.onclick=()=>{selected=d;render()};c.appendChild(b)}el('monthLabel').textContent=`${monthCursor.getFullYear()} 年 ${monthCursor.getMonth()+1} 月`};renderSlots=()=>{let n=offset(selected);el('slotTitle').textContent=`${selected.getMonth()+1} 月 ${selected.getDate()} 日可預約時段`;el('slots').innerHTML=n<0||n>bookingWindow?'<div class="empty">請選擇開放預約的日期</div>':times.map(t=>{let x=booked(n,t);return`<button class="slot ${x?'booked':''}" ${x?'disabled':''} data-time="${t}"><b>${t}</b><small>${x?'已被預約':'尚有名額'}</small></button>`}).join('');document.querySelectorAll('.slot:not(.booked)').forEach(b=>b.onclick=()=>{pending={offset:n,time:b.dataset.time};el('modalText').textContent=`${fmt(selected)} ${b.dataset.time} · 皮拉提斯一對一`;el('modal').classList.add('open')})};render();</script>
<script>(async()=>{if(!location.protocol.startsWith('http'))return;const flowApi='/api/bookings';renderUpcoming=()=>{};renderSummary=()=>{};el('bookingForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const r=await fetch(flowApi,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:dayKey(dateAt(pending.offset)),time:pending.time,name:f.get('name')})});const data=await r.json();if(!r.ok)throw new Error(data.error||'預約失敗');bookings.push(data);el('modal').classList.remove('open');e.target.reset();render();toast('預約成功！時段已為你鎖定')}catch(err){toast(err.message)}};const flowRender=render;render=()=>{flowRender();renderFlowSummary()};function renderFlowSummary(){const list=bookings.slice().sort((a,b)=>a.offset-b.offset||a.time.localeCompare(b.time));let box=document.querySelector('.booking-summary');if(!box){box=document.createElement('section');box.className='booking-summary';box.innerHTML='<h3>我的預約</h3><div id="summaryList"></div>';document.querySelector('.student .hint').after(box)}document.getElementById('summaryList').innerHTML=list.length?list.map(b=>`<div class="booking"><div class="calendar-icon">${dateAt(b.offset).getDate()}</div><div class="booking-main"><strong>${fmt(dateAt(b.offset))} · ${b.time}</strong><small>${b.name} · 皮拉提斯一對一</small></div><button class="cancel" data-api-cancel="${b.id}">取消</button></div>`).join(''):'<div class="empty">目前還沒有預約</div>';document.querySelectorAll('[data-api-cancel]').forEach(x=>x.onclick=async()=>{const r=await fetch(`${flowApi}/${x.dataset.apiCancel}`,{method:'DELETE'});if(r.ok){bookings=bookings.filter(b=>b.id!==+x.dataset.apiCancel);render();toast('預約已取消，時段重新開放')}else toast('取消預約失敗')})}try{const r=await fetch(flowApi);if(r.ok){bookings=await r.json();seed={};render()}}catch(err){toast('目前無法連線到預約服務')}})();</script>

<script>const summary=document.createElement('section');summary.className='booking-summary';summary.innerHTML='<h3>我的預約</h3><div id="summaryList"></div>';document.querySelector('.student .hint').after(summary);function renderSummary(){const list=bookings.slice().sort((a,b)=>a.offset-b.offset||a.time.localeCompare(b.time));document.getElementById('summaryList').innerHTML=list.length?list.map(b=>`<div class="booking"><div class="calendar-icon">${dateAt(b.offset).getDate()}</div><div class="booking-main"><strong>${fmt(dateAt(b.offset))} · ${b.time}</strong><small>${b.name} · 皮拉提斯一對一</small></div><button class="cancel" data-summary-id="${b.id}">取消</button></div>`).join(''):'<div class="empty">目前還沒有預約</div>';document.querySelectorAll('[data-summary-id]').forEach(x=>x.onclick=()=>{bookings=bookings.filter(b=>b.id!==+x.dataset.summaryId);save();render();toast('預約已取消，時段重新開放')})}const originalRender=render;render=()=>{originalRender();renderSummary()};renderSummary()</script>
