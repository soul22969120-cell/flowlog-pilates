<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowLog｜老師管理</title><style>
:root{--ink:#263532;--muted:#71807b;--line:#e3ebe7;--bg:#f5f8f6;--deep:#28665b;--sage:#dceee5;--coral:#d97860;--panel:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1120px)/2))}.brand{display:flex;align-items:center;gap:10px}.mark{width:40px;height:40px;display:grid;place-items:center;color:#263532;font:36px Georgia}.brand strong{display:block}.brand small{color:var(--muted);font-size:11px}.back{color:var(--deep);text-decoration:none;font-size:13px;font-weight:800}.wrap{max-width:1120px;margin:auto;padding:42px 18px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--deep);font-weight:900}.hero h1{font-size:31px;margin:8px 0}.hero p{margin:0;color:var(--muted);font-size:14px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:0 15px 35px #24473e0c}.metric{padding:18px}.metric small{color:var(--muted);font-size:12px}.metric b{display:block;font-size:28px;margin-top:8px}.metric span{font-size:11px;color:var(--deep)}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:22px}.panel{padding:22px}.panel-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:18px}.panel h2{font-size:17px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:5px}.agenda{display:grid;gap:10px}.row{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:12px;padding:13px}.time{width:72px;font-weight:900}.time small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.info{flex:1}.info b{font-size:14px}.info small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.badge{background:var(--sage);color:var(--deep);font-size:11px;padding:6px 9px;border-radius:99px}.danger{border:0;background:none;color:var(--coral);font-size:11px;cursor:pointer}.calendar-head,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calendar-head{margin-bottom:6px}.calendar-head span{text-align:center;color:var(--muted);font-size:11px;font-weight:800}.day{min-height:57px;background:#fbfcfb;border:1px solid var(--line);border-radius:9px;padding:7px;text-align:center}.day b{font-size:14px}.day small{display:block;color:var(--deep);font-size:9px;margin-top:5px}.day.today{background:var(--sage);border-color:#9fcab9}.day.blank{visibility:hidden}.legend{display:flex;gap:14px;color:var(--muted);font-size:11px;margin-top:15px}.dot{width:7px;height:7px;display:inline-block;border-radius:50%;background:var(--deep);margin-right:5px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:25px}.notice{margin-top:14px;padding:13px;border-radius:11px;background:#fff8e8;color:#8a6c26;font-size:12px;line-height:1.5}@media(max-width:760px){.top{padding:14px 15px;height:auto}.wrap{padding:28px 15px}.hero{display:block}.hero h1{font-size:27px}.back{display:inline-block;margin-top:16px}.metrics{gap:8px}.metric{padding:14px}.metric b{font-size:23px}.layout{grid-template-columns:1fr}.panel{padding:17px}.day{min-height:52px;padding:6px 2px}}
</style></head><body><header class="top"><div class="brand"><div class="mark">❀</div><div><strong>FlowLog</strong><small>老師管理</small></div></div><a class="back" href="/">← 回學生預約頁</a></header><main class="wrap"><section class="hero"><div><div class="eyebrow">COACH WORKSPACE</div><h1>今天的課，排得剛剛好。</h1><p>掌握預約狀況，快速調整你的教學安排。</p></div></section><section class="metrics"><div class="metric"><small>未來 7 天預約</small><b id="weekCount">—</b><span>筆已建立</span></div><div class="metric"><small>今天預約</small><b id="todayCount">—</b><span>堂課</span></div><div class="metric"><small>已鎖定時段</small><b id="lockedCount">—</b><span>個時段</span></div></section><div class="layout"><section class="panel"><div class="panel-head"><div><h2>近期預約</h2><div class="sub">學生完成預約後會自動鎖定</div></div><span class="badge" id="status">同步中</span></div><div class="agenda" id="agenda"></div></section><section class="panel"><div class="panel-head"><div><h2>課程行事曆</h2><div class="sub" id="monthLabel"></div></div></div><div class="calendar-head"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="calendar" id="calendar"></div><div class="legend"><span><i class="dot"></i>已有預約</span><span>點日期查看課程</span></div><div class="notice">第一版先使用固定開放時段；之後可以在這裡設定休假、工作時間與新增時段。</div></section></div></main><script>
const names=['日','一','二','三','四','五','六'],today=new Date();today.setHours(0,0,0,0);const dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,dateAt=n=>{const d=new Date(today);d.setDate(today.getDate()+n);return d},fmt=d=>`${d.getMonth()+1}/${d.getDate()}（${names[d.getDay()]}）`;let bookings=[];function render(){const week=bookings.filter(b=>b.offset>=0&&b.offset<7),todayList=bookings.filter(b=>b.offset===0);document.getElementById('weekCount').textContent=week.length;document.getElementById('todayCount').textContent=todayList.length;document.getElementById('lockedCount').textContent=bookings.length;document.getElementById('status').textContent='已同步';document.getElementById('agenda').innerHTML=bookings.length?bookings.map(b=>`<div class="row"><div class="time">${fmt(dateAt(b.offset))}<small>${b.time}</small></div><div class="info"><b>${b.name}</b><small>皮拉提斯一對一</small></div><span class="badge">已預約</span><button class="danger" data-id="${b.id}">解除</button></div>`).join(''):'<div class="empty">目前還沒有預約</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=async()=>{if(!confirm('確定要解除這筆預約嗎？'))return;await fetch('/api/bookings/'+x.dataset.id,{method:'DELETE'});await load()});const c=document.getElementById('calendar'),month=today;c.innerHTML='';const first=new Date(month.getFullYear(),month.getMonth(),1).getDay(),days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();for(let i=0;i<first;i++){const e=document.createElement('div');e.className='day blank';c.appendChild(e)}for(let n=1;n<=days;n++){const d=new Date(month.getFullYear(),month.getMonth(),n),no=Math.round((d-today)/86400000),count=bookings.filter(b=>b.offset===no).length,e=document.createElement('div');e.className='day'+(no===0?' today':'');e.innerHTML=`<b>${n}</b><small>${count?'● '+count+' 堂':''}</small>`;c.appendChild(e)}document.getElementById('monthLabel').textContent=`${month.getFullYear()} 年 ${month.getMonth()+1} 月`};async function load(){try{const r=await fetch('/api/bookings');bookings=await r.json();render()}catch(e){document.getElementById('status').textContent='連線失敗'}}load();
</script></body></html>
<style>

</style>
<style>.admin-only-placeholder{display:none}.hero,.metrics,.layout>.panel:nth-child(2){display:none}.wrap{max-width:760px;padding-top:34px}.panel-head h2{font-size:20px}</style>
<script>(function(){const timer=setInterval(()=>{if(document.getElementById('status').textContent!=='同步中'){clearInterval(timer);const list=bookings.filter(b=>b.offset===0);document.querySelector('.panel-head h2').textContent='今天預約';document.querySelector('.panel-head .sub').textContent=`今天共 ${list.length} 筆預約`;document.getElementById('agenda').innerHTML=list.length?list.map(b=>`<div class="row"><div class="time">${b.time}</div><div class="info"><b>${b.name}</b><small>皮拉提斯一對一</small></div><span class="badge">已預約</span><button class="danger" data-id="${b.id}">解除</button></div>`).join(''):'<div class="empty">今天沒有預約</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=async()=>{if(!confirm('確定要解除這筆預約嗎？'))return;await fetch('/api/bookings/'+x.dataset.id,{method:'DELETE'});location.reload()})}},100)})();</script>
<style>.layout>.panel:nth-child(2){display:block}.calendar-booking{display:block;text-align:left;background:#f0f8f4;border-radius:5px;padding:3px 4px;margin-top:3px;color:var(--deep);font-size:9px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day.today .calendar-booking{background:#fff}.day.has-booking{border-color:#b7d8ca}@media(max-width:760px){.layout>.panel:nth-child(2){display:block}.calendar-booking{font-size:8px;padding:3px 2px}.day{min-height:66px}}</style>
<script>(function(){const timer=setInterval(()=>{if(document.getElementById('status').textContent==='已同步'){clearInterval(timer);document.querySelector('.layout>.panel:nth-child(2) .panel-head h2').textContent='完整預約月曆';document.querySelector('.layout>.panel:nth-child(2) .panel-head .sub').textContent='學生姓名與時段直接顯示在日期下方';document.querySelectorAll('#calendar .day:not(.blank)').forEach(cell=>{const n=Number(cell.querySelector('b')?.textContent||0),d=new Date(today.getFullYear(),today.getMonth(),n),no=Math.round((d-today)/86400000),items=bookings.filter(b=>b.offset===no);cell.classList.toggle('has-booking',items.length>0);cell.innerHTML=`<b>${n}</b>${items.map(b=>`<small class="calendar-booking">${b.time}<br>${b.name}</small>`).join('')}`})}},100)})();</script>

<script>(function(){const old=document.querySelector('.back');if(!old)return;const login=document.createElement('button');login.className='login';login.id='headerLineLogin';login.type='button';const local=location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';login.textContent=local?'本機測試模式':'使用 LINE 登入';login.onclick=()=>{if(local){alert('本機測試模式已啟用，不需要 LINE 登入');return}const base=(window.FLOWLOG_SUPABASE_URL||'').replace(/\/rest\/v1\/?$/,'');const key=window.FLOWLOG_SUPABASE_KEY||'';if(!base||!key){alert('尚未設定 Supabase 連線');return}location.href=base+'/auth/v1/authorize?provider=custom%3Aline-oauth&redirect_to='+encodeURIComponent(location.href)};old.replaceWith(login)})()</script>
<script>
// 本機測試不需要遠端 API；隱藏舊版初始化留下的連線狀態提示。
if(location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.protocol==='file:'){
  const status=document.getElementById('status');
  if(status){status.style.display='none';new MutationObserver(()=>{status.style.display='none'}).observe(status,{childList:true,characterData:true,subtree:true})}

<script>(function(){const clean=()=>{const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())if(n.nodeValue.includes('皮拉提斯一對一'))n.nodeValue=n.nodeValue.replaceAll('皮拉提斯一對一','').replace(/\s+·\s*$/,'')};clean();new MutationObserver(clean).observe(document.body,{childList:true,subtree:true})})()</script>
